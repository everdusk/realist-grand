<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realist Grand LTD | Official Site</title>
    
    <!-- Google verification file name replacement tag -->
    <meta name="google-site-verification" content="google9523a2f8408a4a04" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        /* Fullscreen background image container */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* Background image with a dark overlay so text stays readable */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('ahmed-atef-9SdZxvkGnZM-unsplash.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: clamp(1.1rem, 2.5vw, 1.8rem);
            font-weight: 400;
            color: #66fcf1; /* Neon accent color for gaming aesthetic */
            max-width: 800px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Contact section below the fold */
        .contact-section {
            background-color: #0b0c10;
            padding: 80px 20px;
            text-align: center;
            border-top: 1px solid #1f2833;
        }

        h2 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .email-display {
            font-size: 1.25rem;
            color: #c5a059; /* Elegant gold tint for the email */
            letter-spacing: 1px;
            font-weight: 500;
            user-select: all; /* Allows easy double-click copying */
        }
    </style>
</head>
<body>

    <!-- Top Fullscreen Visual Block -->
    <section class="hero-section">
        <h1>Realist Grand LTD</h1>
        <p class="subtitle">Games made by people who love games</p>
    </section>

    <!-- Bottom Contact Block -->
    <section class="contact-section">
        <h2>Contact Us</h2>
        <div class="email-display">realistgrandltd.office@gmail.com</div>
    </section>

</body>
</html>
